<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tailwindcss-custom-colors</title>
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="One color in, a complete Tailwind 4 theme out. Try it live."
    />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --panel: #f8fafc;
        --accent: #940bdf;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1020;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --line: #1e293b;
          --panel: #111827;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 56rem;
        margin: 0 auto;
        padding: 3rem 1rem 4rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        line-height: 1.2;
      }
      h2 {
        margin: 2.5rem 0 0.75rem;
        font-size: 1.125rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin: 1.5rem 0;
      }
      .controls label {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        color: var(--muted);
        font-size: 0.875rem;
      }
      input,
      select,
      button {
        font: inherit;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        padding: 0.4rem 0.6rem;
      }
      input[type='color'] {
        padding: 0.15rem;
        width: 3rem;
        height: 2.4rem;
        cursor: pointer;
      }
      input[type='text'] {
        width: 12rem;
      }
      button {
        cursor: pointer;
        background: var(--accent);
        color: var(--on-accent);
        border-color: transparent;
      }
      .error {
        color: #dc2626;
        min-height: 1.5rem;
        margin: 0 0 1rem;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(11, 1fr);
        gap: 0.25rem;
        margin-bottom: 0.25rem;
      }
      .swatch {
        border-radius: 0.375rem;
        padding: 0.5rem 0.25rem;
        min-height: 4rem;
        font-size: 0.7rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .mode {
        margin: 1rem 0 0.25rem;
        font-size: 0.875rem;
        color: var(--muted);
      }
      pre {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        padding: 1rem;
        overflow-x: auto;
        font-size: 0.8rem;
        margin: 0 0 0.75rem;
      }
      code {
        font-family: ui-monospace, monospace;
      }
      @media (max-width: 40rem) {
        .row {
          grid-template-columns: repeat(6, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>tailwindcss-custom-colors</h1>
      <p>
        One color in, a complete Tailwind 4 theme out. OKLCH scales, a mirrored
        dark scale, measured contrast, zero dependency.
      </p>
      <p>
        <a href="https://www.npmjs.com/package/tailwindcss-custom-colors"
          >npm</a
        >
        /
        <a href="https://github.com/quentinjuarez/tailwindcss-custom-colors"
          >GitHub</a
        >
      </p>

      <div class="controls">
        <input
          id="picker"
          type="color"
          value="#940bdf"
          aria-label="Pick a color"
        />
        <input
          id="text"
          type="text"
          value="#940bdf"
          aria-label="Any CSS color"
          spellcheck="false"
        />
        <label
          >Dark mode
          <select id="dark">
            <option value="media">media</option>
            <option value="class">class</option>
            <option value="none">none</option>
          </select>
        </label>
        <label
          >Gamut
          <select id="gamut">
            <option value="srgb">srgb</option>
            <option value="p3">p3</option>
          </select>
        </label>
      </div>
      <div id="error" class="error" role="status"></div>

      <h2>Scales</h2>
      <div id="scales"></div>

      <h2>CSS</h2>
      <pre><code id="css"></code></pre>
      <button id="copy" type="button">Copy CSS</button>

      <h2>CLI</h2>
      <pre><code id="cli"></code></pre>
    </main>

    <script type="module">
      import { createTheme } from 'https://cdn.jsdelivr.net/npm/tailwindcss-custom-colors@2.1.0/dist/esm/index.js';

      const $ = (id) => document.getElementById(id);
      const picker = $('picker');
      const text = $('text');
      const dark = $('dark');
      const gamut = $('gamut');
      let css = '';

      function row(label, scale) {
        const swatches = Object.entries(scale.steps)
          .map(([step, { hex, oklch }]) => {
            const [r, g, b] = [1, 3, 5].map((i) =>
              parseInt(hex.slice(i, i + 2), 16),
            );
            const fg =
              r * 0.299 + g * 0.587 + b * 0.114 > 150 ? '#000000' : '#ffffff';
            return `<div class="swatch" style="background:${hex};background:${oklch};color:${fg}"><b>${step}</b>${hex}</div>`;
          })
          .join('');
        return `<div class="mode">${label}, text on 500: ${scale.contrast} (${scale.ratio.toFixed(2)}:1)</div><div class="row">${swatches}</div>`;
      }

      function render() {
        const value = text.value.trim();
        const flag = dark.value;
        const space = gamut.value;
        try {
          const theme = createTheme(
            { primary: value },
            { dark: flag === 'none' ? false : flag, gamut: space },
          );
          const { light, dark: darkScale } = theme.scales.primary;
          css = theme.css;
          $('scales').innerHTML = row('Light', light) + row('Dark', darkScale);
          $('css').textContent = css;
          $('cli').textContent =
            `npx tailwindcss-custom-colors primary=${value}${flag === 'media' ? '' : ` --dark ${flag}`}${space === 'srgb' ? '' : ` --gamut ${space}`} > theme.css`;
          $('error').textContent = '';
          const root = document.documentElement.style;
          root.setProperty('--accent', light.steps[500].hex);
          root.setProperty('--on-accent', light.contrast);
        } catch (e) {
          $('error').textContent = e.message;
        }
      }

      picker.addEventListener('input', () => {
        text.value = picker.value;
        render();
      });
      text.addEventListener('input', () => {
        if (/^#[0-9a-f]{6}$/i.test(text.value.trim()))
          picker.value = text.value.trim();
        render();
      });
      dark.addEventListener('change', render);
      gamut.addEventListener('change', render);
      $('copy').addEventListener('click', async () => {
        await navigator.clipboard.writeText(css);
        $('copy').textContent = 'Copied';
        setTimeout(() => ($('copy').textContent = 'Copy CSS'), 1500);
      });

      render();
    </script>
  </body>
</html>
